<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
<section class="schoolloginpage">
<div class="container logincontainer">
 <div class="row justify-content-between">
    <div class="col-4 text-center text-white fs-4">
     <h3>School Management System</h3>
     <p>Manage your school, students, teachers, attendance, examinations and fees from one secure platform.</p>
     <img src="Images/schooleducation1.jpg" alt="" class="loginimage">
    </div>
    <div class="col-4 text-center text-white">
      <h4>Login Form</h4>
      <h5>Welcome Back!</h5>
      <h6 class="fs-4">Sign in to your School Management System</h6>
      <form action="" class="loginform">
        <label for="user-role">Choose a Role</label>
        <select name="role" id="user-role" class="form-control" required>
        <option value="admin">Admin</option>
        <option value="Teacher">Teacher</option>
        <option value="Student">Student</option>
        <option value="parent">Parent</option>
        </select>
        <label for="username">Enter User Name</label>
       <input type="text" name="username" id="usernameid" class="form-control">
       <label for="email">Email</label>
       <input type="email" name="email" id="emailid" class="form-control">
       <label for="password">Password</label>
       <input type="password" name="password" id="passwordid" class="form-control">
       <div class="form-check mt-2">
        <input type="checkbox" name="rememberMe" id="rememberMe" class="form-check-input">
        <label for="" class="form-check-label">Remember Me</label>
       </div>
       <div class="mt-2">
        <a href="forgot-password.html" class="text-decoration-none">Forgot password</a>
       </div>
       <div class="loginbutton mt-2">
       <button class="btn btn-primary" type="submit">Login</button>
       </div>
      </form>
    </div>
  </div>
</div>
</section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>  
</body>
</html>
